<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendas de Barrio</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+4ps9wPEN3YVBADJ6jKpP0LQ9U1hbT9fDxA6CXYMw=" crossorigin="" />
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #111315;
            --text-color: #F5F7FA;
            --accent-color: #A3FF12;
            --card-bg: #1A1D21;
            --border-color: rgba(255, 255, 255, 0.08);
            --muted-text: rgba(245, 247, 250, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 1rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2rem, 3vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
            display: grid;
            gap: 2rem;
        }

        section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        section h2::before {
            content: "";
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            display: inline-block;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        label {
            font-size: 0.95rem;
            color: var(--muted-text);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(163, 255, 18, 0.15);
        }

        button {
            padding: 0.85rem 1.5rem;
            border-radius: 999px;
            border: none;
            background: var(--accent-color);
            color: #111315;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            width: fit-content;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(163, 255, 18, 0.25);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .form-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .table-wrapper {
            margin-top: 1.5rem;
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 320px;
        }

        thead {
            background: rgba(163, 255, 18, 0.08);
        }

        th,
        td {
            padding: 0.85rem 1rem;
            text-align: left;
            font-size: 0.95rem;
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:hover {
            background: rgba(163, 255, 18, 0.1);
        }

        #map {
            width: 100%;
            height: 420px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .leaflet-control-attribution,
        .leaflet-control-scale {
            background: rgba(26, 29, 33, 0.75) !important;
            color: var(--muted-text) !important;
        }

        .custom-store-icon {
            width: 24px;
            height: 24px;
        }

        .custom-store-icon span {
            display: block;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            border-radius: 50%;
            border: 3px solid #0B0C0F;
            box-shadow: 0 10px 18px rgba(163, 255, 18, 0.35);
        }

        .product-empty {
            margin-top: 1.5rem;
            color: var(--muted-text);
            font-size: 0.95rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            section {
                padding: 1.5rem;
            }

            button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tiendas de Barrio</h1>
        <p style="margin-top: 0.5rem; color: var(--muted-text); max-width: 680px;">
            Administra el inventario de tus productos y visualiza las tiendas en un mapa interactivo inspirado en la experiencia minimalista de inDriver.
        </p>
    </header>

    <main>
        <section aria-labelledby="gestion-productos">
            <h2 id="gestion-productos">Gestión de Productos</h2>
            <form id="product-form" autocomplete="off">
                <div class="form-grid">
                    <div>
                        <label for="product-name">Nombre del producto</label>
                        <input type="text" id="product-name" name="product-name" placeholder="Ej. Café de origen" required>
                    </div>
                    <div>
                        <label for="product-price">Precio</label>
                        <input type="number" id="product-price" name="product-price" placeholder="Ej. 15000" min="0" step="0.01" required>
                    </div>
                    <div>
                        <label for="product-stock">Stock</label>
                        <input type="number" id="product-stock" name="product-stock" placeholder="Ej. 25" min="0" step="1" required>
                    </div>
                </div>
                <button type="submit">Agregar producto</button>
            </form>

            <div id="empty-message" class="product-empty">No hay productos registrados todavía. Agrega el primero con el formulario.</div>

            <div class="table-wrapper" id="table-wrapper" hidden>
                <table aria-describedby="gestion-productos">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                    </tbody>
                </table>
            </div>
        </section>

        <section aria-labelledby="mapa-tiendas">
            <h2 id="mapa-tiendas">Mapa de Tiendas</h2>
            <div id="map" role="application" aria-label="Mapa de tiendas de barrio en Cúcuta"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7kG8G42PfY2n0uZ1sz1xSiJk0dGIzGj30+3V0k=" crossorigin=""></script>
    <script>
        const products = [];
        const productForm = document.getElementById('product-form');
        const productTableBody = document.getElementById('product-table-body');
        const tableWrapper = document.getElementById('table-wrapper');
        const emptyMessage = document.getElementById('empty-message');

        function formatCurrency(value) {
            if (Number.isNaN(value)) return '';
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                maximumFractionDigits: value % 1 === 0 ? 0 : 2
            }).format(value);
        }

        function renderProducts() {
            productTableBody.innerHTML = '';

            if (products.length === 0) {
                tableWrapper.hidden = true;
                emptyMessage.hidden = false;
                return;
            }

            tableWrapper.hidden = false;
            emptyMessage.hidden = true;

            products.forEach(({ name, price, stock }) => {
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = name;

                const priceCell = document.createElement('td');
                priceCell.textContent = formatCurrency(price);

                const stockCell = document.createElement('td');
                stockCell.textContent = stock;

                row.appendChild(nameCell);
                row.appendChild(priceCell);
                row.appendChild(stockCell);

                productTableBody.appendChild(row);
            });
        }

        productForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const formData = new FormData(productForm);
            const name = formData.get('product-name').trim();
            const price = Number(formData.get('product-price'));
            const stock = Number(formData.get('product-stock'));

            if (!name || Number.isNaN(price) || Number.isNaN(stock)) {
                return;
            }

            products.push({ name, price, stock });
            renderProducts();

            productForm.reset();
            document.getElementById('product-name').focus();
        });

        // Leaflet map setup centered on Cúcuta, Colombia
        const cucutaCoordinates = [7.8939, -72.5078];
        const map = L.map('map', {
            zoomControl: false
        }).setView(cucutaCoordinates, 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> & contributors, &copy; <a href="https://carto.com/attributions">CARTO</a>',
            maxZoom: 19
        }).addTo(map);

        const storeIcon = L.divIcon({
            className: 'custom-store-icon',
            html: '<span aria-hidden="true"></span>',
            iconSize: [24, 24],
            iconAnchor: [12, 24],
            popupAnchor: [0, -26]
        });

        const exampleMarker = L.marker(cucutaCoordinates, { icon: storeIcon }).addTo(map);
        exampleMarker.bindPopup('<strong>Tienda de ejemplo</strong><br>Cúcuta, Colombia');

        // Función preparada para agregar más tiendas en el futuro
        function addStoreMarker(lat, lng, options = {}) {
            const markerOptions = { icon: storeIcon, ...options };
            return L.marker([lat, lng], markerOptions).addTo(map);
        }

        // Ejemplo de uso futuro:
        // addStoreMarker(7.9000, -72.5000, { title: 'Otra tienda' });
    </script>
</body>
</html>
